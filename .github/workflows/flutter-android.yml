name: Flutter Android validation
on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

jobs:
  analyze-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: gradle --version
      - run: flutter pub get
      - name: Format Dart files
        run: dart format lib
      - run: flutter analyze
      - run: flutter test
      # Flutter invokes android/gradlew when present; generate a pinned wrapper.
      - name: Generate Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.14.3 --distribution-type bin
      - name: Verify Gradle wrapper
        working-directory: android
        run: ./gradlew --version
      - name: Build release APKs per architecture
        run: flutter build apk --release --split-per-abi
      - name: Prepare APK checksums
        working-directory: build/app/outputs/flutter-apk
        run: sha256sum *.apk > SHA256SUMS
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ultron-mobile-release
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/flutter-apk/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
