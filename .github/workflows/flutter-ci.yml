name: Flutter CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    # ORG_GRADLE_PROJECT_* é lido automaticamente pelo Gradle como propriedade de projeto,
    # então `flutter build apk` (e qualquer ./gradlew) herda a AccessKey sem passar -P.
    # O segredo é mascarado automaticamente nos logs do GitHub Actions.
    env:
      ORG_GRADLE_PROJECT_porcupineAccessKey: ${{ secrets.PORCUPINE_ACCESS_KEY }}
      PORCUPINE_ACCESS_KEY: ${{ secrets.PORCUPINE_ACCESS_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Generate Android platform
        run: flutter create --platforms=android --org com.viniciusnpaula --project-name=ultron_mobile .
      # flutter create rewrites pubspec.yaml and some Android files; the versioned
      # copies (manifest, applicationId, desugaring, signing) always win.
      - name: Restore committed files
        run: |
          git checkout -- pubspec.yaml
          git checkout -- android
          rm -f test/widget_test.dart
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      # The Kotlin matcher tests are not compiled by `flutter build`; run them explicitly.
      - name: Native unit tests (wake word matcher)
        working-directory: android
        # Only our module: plugin subprojects ship Robolectric tests that fail on the CI JDK image.
        run: ./gradlew :app:testDebugUnitTest --no-daemon
      # Two Gradle builds in one job filled the runner disk (app-debug plus
      # app-release both keep their merged native libs). Drop toolchains this
      # project never uses; the Android SDK and the NDK stay.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/share/boost /opt/ghc /usr/share/swift
          sudo rm -rf "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/emulator
          sudo rm -rf "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/system-images
          sudo docker image prune -af
          df -h /
      # Modelo Vosk (~45 MB compactado): baixado no CI e verificado pelo SHA-256 fixo.
      # Executado depois do `git checkout -- android` (restaura só arquivos versionados) e
      # antes do build, valendo para debug e release.
      - name: Fetch Vosk model
        run: |
          mkdir -p android/app/src/main/assets/vosk
          curl -sSL -o /tmp/vosk-model.zip \
            https://alphacephei.com/vosk/models/vosk-model-small-pt-0.3.zip
          echo "6e1ce909032e1afa7a88e68a3d628ecafff302bdf195befab308826c395e93b7  /tmp/vosk-model.zip" \
            | sha256sum -c -
          mv /tmp/vosk-model.zip android/app/src/main/assets/vosk/model-pt.zip

      - name: Build debug APK
        run: |
          if [ -z "$PORCUPINE_ACCESS_KEY" ]; then
            echo "::warning::PORCUPINE_ACCESS_KEY ausente — APK sai sem palavra de ativacao"
          fi
          flutter build apk --debug

      - name: Assert Porcupine AccessKey reached BuildConfig
        if: env.PORCUPINE_ACCESS_KEY != ''
        run: |
          GREP_FILE="$(find android/app/build/generated/source/buildConfig -name BuildConfig.java | head -1)"
          test -n "$GREP_FILE"
          grep -q 'public static final String PORCUPINE_ACCESS_KEY' "$GREP_FILE"
          # Garante que a chave de fato chegou (não é string vazia).
          ! grep -q 'PORCUPINE_ACCESS_KEY = ""' "$GREP_FILE"
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ultron-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      # Regression guard: the release variant is the one that ships, and it does
      # not inherit the INTERNET permission from src/debug/AndroidManifest.xml.
      - name: Check release APK permissions and app id
        run: |
          flutter build apk --release
          APK="build/app/outputs/flutter-apk/app-release.apk"
          AAPT="$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/* | sort -V | tail -1)/aapt2"
          "$AAPT" dump permissions "$APK"
          "$AAPT" dump badging "$APK" | head -1
          "$AAPT" dump permissions "$APK" | grep -q "android.permission.INTERNET"
          "$AAPT" dump permissions "$APK" | grep -q "android.permission.REQUEST_INSTALL_PACKAGES"
          "$AAPT" dump permissions "$APK" | grep -q "android.permission.USE_BIOMETRIC"
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.viniciusnpaula.ultron_mobile'"
