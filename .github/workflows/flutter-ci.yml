name: Flutter CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Generate Android platform
        run: flutter create --platforms=android --project-name=ultron_mobile .
      - name: Remove generated default widget test
        run: rm -f test/widget_test.dart
      - name: Enable Android core library desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle.kts")
          lines = path.read_text().splitlines()

          compile_index = next((i for i, line in enumerate(lines) if line.strip() == "compileOptions {"), None)
          if compile_index is None:
              raise SystemExit("compileOptions block not found")

          if not any("isCoreLibraryDesugaringEnabled = true" in line for line in lines):
              lines.insert(compile_index + 1, "        isCoreLibraryDesugaringEnabled = true")

          dependency = '    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          if not any("desugar_jdk_libs" in line for line in lines):
              dependency_index = next((i for i, line in enumerate(lines) if line.strip() == "dependencies {"), None)
              if dependency_index is None:
                  raise SystemExit("dependencies block not found")
              lines.insert(dependency_index + 1, dependency)

          result = "\\n".join(lines) + "\\n"
          if "isCoreLibraryDesugaringEnabled = true" not in result or "desugar_jdk_libs" not in result:
              raise SystemExit("Desugaring configuration verification failed")
          path.write_text(result)
          print("Desugaring enabled and dependency verified.")
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ultron-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
