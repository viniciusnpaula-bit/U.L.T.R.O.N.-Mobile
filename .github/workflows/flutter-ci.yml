name: Flutter CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Generate Android platform
        run: flutter create --platforms=android --project-name=ultron_mobile .
      - name: Remove generated default widget test
        run: rm -f test/widget_test.dart
      - name: Enable Android core library desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          marker = "    compileOptions {"
          if marker not in s:
              raise SystemExit("compileOptions block not found in generated Android app Gradle file")
          start = s.index(marker)
          end = s.index("    }", start) + 5
          block = s[start:end]
          if "isCoreLibraryDesugaringEnabled" not in block:
              block = block.replace(marker, marker + chr(10) + "        isCoreLibraryDesugaringEnabled = true")
              s = s[:start] + block + s[end:]
          dep = '    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          if dep not in s:
              s = s.replace("dependencies {", "dependencies {" + chr(10) + dep, 1)
          p.write_text(s)
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ultron-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
