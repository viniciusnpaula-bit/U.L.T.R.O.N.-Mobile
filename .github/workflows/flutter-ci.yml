name: Flutter CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Generate Android platform
        run: flutter create --platforms=android --project-name=ultron_mobile .
      - name: Remove generated default widget test
        run: rm -f test/widget_test.dart
      - name: Enable Android core library desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          if "isCoreLibraryDesugaringEnabled = true" not in s:
              s, count = re.subn(
                  r"(compileOptions\\s*\\{)",
                  r"\\1\\n    isCoreLibraryDesugaringEnabled = true",
                  s,
                  count=1,
          )
              if count != 1:
                  raise SystemExit("Could not enable core library desugaring in compileOptions")

          dependency = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          if dependency not in s:
              s, count = re.subn(
                  r"(?m)^dependencies\\s*\\{",
                  lambda match: match.group(0) + "\\n    " + dependency,
                  s,
                  count=1,
          )
              if count != 1:
                  raise SystemExit("Could not locate app dependencies block")

          if dependency not in s:
              raise SystemExit("Desugaring dependency was not inserted")
          p.write_text(s)
          print("Verified core library desugaring configuration:")
          print("\\n".join(line for line in s.splitlines() if "desugaring" in line.lower() or "desugar_jdk" in line))
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ultron-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
