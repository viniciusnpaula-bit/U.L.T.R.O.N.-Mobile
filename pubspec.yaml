name: ultron_mobile
description: U.L.T.R.O.N. Mobile autonomous Android assistant
publish_to: none
version: 1.2.2+15
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  local_auth: ^2.3.0
  flutter_tts: ^4.2.2
  path: ^1.9.1
  path_provider: ^2.1.5
  sqflite: ^2.4.2
  flutter_secure_storage: ^9.2.4
  package_info_plus: ^8.3.0
  open_filex: ^4.7.0
  crypto: ^3.0.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Runs sqflite on the desktop VM so the SQL layer is covered by `flutter test`.
  sqflite_common_ffi: ^2.3.0
flutter:
  uses-material-design: true
