# Trace de consumo de energia/CPU do U.L.T.R.O.N. em standby (5 minutos).
# Uso: perfetto -c scripts/perfetto-ultron.cfg -o ultron_trace.perfetto-trace
# (requer aparelho rootado ou perfetto via adb shell com permissao adequada).

buffers: {
    size_kb: 32768
    fill_policy: RING_BUFFER
}

data_sources: {
    config {
        name: "linux.ftrace"
        ftrace_config {
            ftrace_events: "sched/sched_switch"
            ftrace_events: "power/cpu_frequency"
            ftrace_events: "power/suspend_resume"
            ftrace_events: "cpuidle/state"
        }
    }
}

data_sources: {
    config {
        name: "android.power"
    }
}

duration_ms: 300000
